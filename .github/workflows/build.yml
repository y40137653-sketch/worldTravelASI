name: Build WorldTravel ASI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 下載原始碼
        uses: actions/checkout@v4

      - name: 設定 MSBuild 編譯環境
        uses: microsoft/setup-msbuild@v2

      - name: 自動修補 Shlwapi.lib 並編譯所有專案
        run: |
          Get-ChildItem -Filter *.vcxproj -Recurse | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace 'ScriptHookV\.lib', 'ScriptHookV.lib;Shlwapi.lib'
            Set-Content -Path $_.FullName -Value $content
          }
          Get-ChildItem -Filter *.sln -Recurse | ForEach-Object {
            msbuild $_.FullName /p:Configuration=Release /p:Platform=x64
          }

      - name: 打包產出的 ASI 檔案
        uses: actions/upload-artifact@v4
        with:
          name: WorldTravel-ASI
          path: |
            **/Release/*.asi
            **/x64/Release/*.asi
